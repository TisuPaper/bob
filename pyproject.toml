[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-log-guard"
version = "0.1.0"
description = "Detect, trace, and repair PII in Python logs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pii-guard = "pii_guard.cli:main"

[tool.setuptools.packages.find]
include = ["pii_guard*"]
